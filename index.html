<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис по ремонту бензо-электро инструмента</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #eee; min-height: 100vh; padding: 20px; }
        h1 { text-align: center; color: #f39c12; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: rgba(22,33,62,0.9); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .card h2 { color: #e94560; margin-bottom: 20px; border-bottom: 2px solid #e94560; padding-bottom: 10px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { position: relative; }
        .form-group label { display: block; margin-bottom: 5px; color: #a29bfe; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 15px; font-size: 16px; border: 2px solid #0f3460; border-radius: 8px; background: #0f3460; color: #fff; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #e94560; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; background: #1a1a2e; border: 2px solid #e94560; border-top: none; border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; }
        .autocomplete-list.active { display: block; }
        .autocomplete-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #0f3460; }
        .autocomplete-item:hover { background: #e94560; color: #fff; }
        .autocomplete-item.last-used { background: #2d4a3e; border-left: 4px solid #4ecdc4; }
        .btn { padding: 12px 30px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; margin-right: 10px; }
        .btn-primary { background: linear-gradient(135deg, #e94560, #c73e54); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(233,69,96,0.4); }
        .btn-success { background: linear-gradient(135deg, #27ae60, #1e8449); color: #fff; }
        .btn-success:hover { transform: translateY(-2px); }
        .btn-warning { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; }
        .btn-group { margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #0f3460; }
        th { background: #0f3460; color: #f39c12; }
        tr:hover { background: rgba(233,69,96,0.1); }
        .status-new { color: #e74c3c; font-weight: bold; }
        .status-done { color: #27ae60; font-weight: bold; }
        .price { color: #4ecdc4; font-weight: bold; }
        .order-number { color: #f39c12; font-weight: bold; font-size: 18px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 12px 25px; background: #0f3460; border: none; border-radius: 8px; color: #fff; cursor: pointer; }
        .tab.active { background: #e94560; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; text-align: center; }
        .summary-item { background: #0f3460; padding: 15px; border-radius: 10px; }
        .summary-item .num { font-size: 28px; color: #f39c12; font-weight: bold; }
        .summary-item .label { color: #a29bfe; font-size: 14px; margin-top: 5px; }
        .search-box { margin-bottom: 15px; }
        .search-box input { padding: 12px; font-size: 16px; border: 2px solid #0f3460; border-radius: 8px; background: #0f3460; color: #fff; width: 100%; }
        .action-btn { padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; }
        .action-edit { background: #f39c12; color: #fff; }
        .action-done { background: #27ae60; color: #fff; }
        .action-delete { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>
    <h1>🔧 Сервис по ремонту бензо-электро инструмента</h1>
    
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="showTab('new')">➕ Новый ремонт</button>
            <button class="tab" onclick="showTab('list')">📋 Ремонты</button>
            <button class="tab" onclick="showTab('stats')">📊 Статистика</button>
        </div>

        <div id="tab-new" class="tab-content active">
            <div class="card">
                <h2>Новый ремонт</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>№ Ремонта</label>
                        <input type="text" id="orderNumber" readonly>
                    </div>
                    <div class="form-group">
                        <label>Дата</label>
                        <input type="date" id="orderDate">
                    </div>
                    <div class="form-group">
                        <label>Телефон клиента</label>
                        <input type="tel" id="clientPhone" placeholder="+7 999 123-45-67">
                    </div>
                    <div class="form-group">
                        <label>Имя клиента</label>
                        <input type="text" id="clientName" placeholder="Иван">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Инструмент</label>
                        <input type="text" id="tool" placeholder="Бензопила, УШМ, триммер..." list="toolsList" oninput="showAutocomplete('tool', this.value, 'toolAutocomplete')">
                        <div id="toolAutocomplete" class="autocomplete-list"></div>
                        <datalist id="toolsList">
                            <option value="Бензопила">
                            <option value="Триммер">
                            <option value="Мотокоса">
                            <option value="Кусторез">
                            <option value="Воздуходувка">
                            <option value="Мойка высокого давления">
                            <option value="Электропила">
                            <option value="УШМ (болгарка)">
                            <option value="Дрель">
                            <option value="Перфоратор">
                            <option value="Лобзик">
                            <option value="Отбойный молоток">
                            <option value="Генератор">
                            <option value="Компрессор">
                            <option value="Насос">
                            <option value="Газонокосилка">
                            <option value="Снегоуборщик">
                            <option value="Культиватор">
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label>Неисправность</label>
                        <input type="text" id="malfunction" placeholder="Не заводится, давится на газу..." oninput="showAutocomplete('malfunction', this.value, 'malfunctionAutocomplete')">
                        <div id="malfunctionAutocomplete" class="autocomplete-list"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="description" rows="3" placeholder="Подробное описание проблемы..."></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="saveOrder()">💾 Сохранить</button>
                </div>
            </div>

            <div class="card" id="repairComplete" style="display:none;">
                <h2>Завершение ремонта</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Стоимость ремонта (руб)</label>
                        <input type="number" id="repairCost" placeholder="1500">
                    </div>
                    <div class="form-group">
                        <label>Купленные запчасти</label>
                        <input type="text" id="purchasedParts" placeholder="Цепь, свеча, фильтр...">
                    </div>
                    <div class="form-group">
                        <label>Стоимость запчастей (руб)</label>
                        <input type="number" id="partsCost" placeholder="500">
                    </div>
                </div>
                <div class="form-group">
                    <label>Примечание</label>
                    <textarea id="repairNote" rows="2" placeholder="Что было сделано..."></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="completeOrder()">✅ Завершить ремонт</button>
                </div>
            </div>
        </div>

        <div id="tab-list" class="tab-content">
            <div class="card">
                <h2>Список ремонтов</h2>
                <div class="search-box">
                    <input type="text" id="searchOrders" placeholder="Поиск по номеру, телефону, инструменту..." oninput="renderOrders()">
                </div>
                <div style="overflow-x: auto;">
                    <table id="ordersTable">
                        <thead>
                            <tr>
                                <th>№</th>
                                <th>Дата</th>
                                <th>Клиент</th>
                                <th>Телефон</th>
                                <th>Инструмент</th>
                                <th>Неисправность</th>
                                <th>Статус</th>
                                <th>Сумма</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="ordersList"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="tab-stats" class="tab-content">
            <div class="card">
                <h2>Статистика</h2>
                <div class="summary">
                    <div class="summary-item">
                        <div class="num" id="statTotal">0</div>
                        <div class="label">Всего ремонтов</div>
                    </div>
                    <div class="summary-item">
                        <div class="num" id="statNew">0</div>
                        <div class="label">В ожидании</div>
                    </div>
                    <div class="summary-item">
                        <div class="num" id="statDone">0</div>
                        <div class="label">Завершено</div>
                    </div>
                    <div class="summary-item">
                        <div class="num" id="statRevenue">0₽</div>
                        <div class="label">Выручка</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>Популярные инструменты</h2>
                <table id="toolsStatsTable">
                    <thead>
                        <tr><th>Инструмент</th><th>Кол-во</th><th>Сумма</th></tr>
                    </thead>
                    <tbody id="toolsStats"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const malfunctions = [
            "Не заводится", "Глохнет при нажатии газа", "Давится на газу", "Давится при нажатии газа",
            "Плохо набирает обороты", "Не набирает обороты", "Искрит из глушителя", "Искрит",
            "Дымит белым дымом", "Дымит синим дымом", "Дымит черным дымом", "Дымит",
            "Не подает масло на цепь", "Не смазывает цепь",
            "Не крутит цепь", "Не вращается", "Сильная вибрация", "Вибрация",
            "Не останавливается", "Течет масло", "Слабая мощность",
            "Не включается", "Не работает", "Сам выключается",
            "Шумит", "Стучит", "Треск", "Заклинивает",
            "Нет компрессии", "Слабая компрессия",
            "Перегрев", "Горит", "Запах гари",
            "Не вращается насадка", "Не вращается нож", "Не вращается леска",
            "Нет давления", "Слабое давление",
            "Не режет", "Плохо режет",
            "Не меняет обороты", "Не регулируются обороты",
            "Не долбит", "Слабый удар",
            "Течет вода", "Шум в насосе"
        ];

        const toolsAutocomplete = [
            "Бензопила", "Триммер", "Мотокоса", "Кусторез", "Воздуходувка",
            "Мойка высокого давления", "Электропила", "Цепная электропила", "УШМ", "Болгарка",
            "Дрель", "Перфоратор", "Лобзик", "Отбойный молоток", "Генератор",
            "Компрессор", "Сварочный аппарат", "Тепловая пушка", "Насос", "Газонокосилка",
            "Снегоуборочная машина", "Культиватор"
        ];

        let orders = JSON.parse(localStorage.getItem('repairOrders')) || [];
        let currentOrderId = null;
        let lastOrderNumber = parseInt(localStorage.getItem('lastOrderNumber')) || 6000;

        function init() {
            document.getElementById('orderDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('orderNumber').value = lastOrderNumber + 1;
            renderOrders();
            updateStats();
        }

        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'list') renderOrders();
            if (tab === 'stats') updateStats();
        }

        function showAutocomplete(type, value, listId) {
            const list = document.getElementById(listId);
            if (!value || value.length < 1) {
                list.classList.remove('active');
                return;
            }
            
            let items;
            if (type === 'tool') {
                items = toolsAutocomplete.filter(t => t.toLowerCase().includes(value.toLowerCase()));
            } else {
                items = malfunctions.filter(m => m.toLowerCase().includes(value.toLowerCase()));
            }
            
            // Add recently used
            const recentKey = type === 'tool' ? 'recentTools' : 'recentMalfunctions';
            const recent = JSON.parse(localStorage.getItem(recentKey)) || [];
            const recentItems = recent.filter(r => r.toLowerCase().includes(value.toLowerCase()));
            
            if (recentItems.length > 0) {
                items = [...new Set([...recentItems, ...items])];
            }
            
            if (items.length === 0) {
                list.classList.remove('active');
                return;
            }
            
            list.innerHTML = items.map(item => `
                <div class="autocomplete-item ${recent.includes(item) ? 'last-used' : ''}" 
                     onclick="selectAutocomplete('${type}', '${item}', '${listId}')">${item}</div>
            `).join('');
            list.classList.add('active');
        }

        function selectAutocomplete(type, value, listId) {
            const inputId = type === 'tool' ? 'tool' : 'malfunction';
            document.getElementById(inputId).value = value;
            document.getElementById(listId).classList.remove('active');
            
            // Save to recent
            const key = type === 'tool' ? 'recentTools' : 'recentMalfunctions';
            let recent = JSON.parse(localStorage.getItem(key)) || [];
            recent = [value, ...recent.filter(r => r !== value)].slice(0, 10);
            localStorage.setItem(key, JSON.stringify(recent));
        }

        document.addEventListener('click', function(e) {
            if (!e.target.classList.contains('autocomplete-item')) {
                document.querySelectorAll('.autocomplete-list').forEach(l => l.classList.remove('active'));
            }
        });

        function saveOrder() {
            const order = {
                id: lastOrderNumber + 1,
                date: document.getElementById('orderDate').value,
                phone: document.getElementById('clientPhone').value,
                clientName: document.getElementById('clientName').value,
                tool: document.getElementById('tool').value,
                malfunction: document.getElementById('malfunction').value,
                description: document.getElementById('description').value,
                status: 'new',
                repairCost: 0,
                partsCost: 0,
                purchasedParts: '',
                repairNote: '',
                completedDate: null
            };

            if (!order.tool || !order.malfunction) {
                alert('Заполните инструмент и неисправность!');
                return;
            }

            orders.unshift(order);
            lastOrderNumber++;
            localStorage.setItem('lastOrderNumber', lastOrderNumber);
            localStorage.setItem('repairOrders', JSON.stringify(orders));
            
            currentOrderId = order.id;
            document.getElementById('repairComplete').style.display = 'block';
            
            // Save to recent
            let recentTools = JSON.parse(localStorage.getItem('recentTools')) || [];
            recentTools = [order.tool, ...recentTools.filter(t => t !== order.tool)].slice(0, 10);
            localStorage.setItem('recentTools', JSON.stringify(recentTools));
            
            let recentMalfunctions = JSON.parse(localStorage.getItem('recentMalfunctions')) || [];
            recentMalfunctions = [order.malfunction, ...recentMalfunctions.filter(m => m !== order.malfunction)].slice(0, 10);
            localStorage.setItem('recentMalfunctions', JSON.stringify(recentMalfunctions));
            
            clearForm();
            document.getElementById('orderNumber').value = lastOrderNumber + 1;
            renderOrders();
            alert('Ремонт #' + order.id + ' сохранен!');
        }

        function clearForm() {
            document.getElementById('clientPhone').value = '';
            document.getElementById('clientName').value = '';
            document.getElementById('tool').value = '';
            document.getElementById('malfunction').value = '';
            document.getElementById('description').value = '';
            document.getElementById('repairCost').value = '';
            document.getElementById('purchasedParts').value = '';
            document.getElementById('partsCost').value = '';
            document.getElementById('repairNote').value = '';
        }

        function completeOrder() {
            if (!currentOrderId) {
                alert('Выберите ремонт для завершения!');
                return;
            }

            const order = orders.find(o => o.id === currentOrderId);
            if (order) {
                order.status = 'done';
                order.repairCost = parseInt(document.getElementById('repairCost').value) || 0;
                order.partsCost = parseInt(document.getElementById('partsCost').value) || 0;
                order.purchasedParts = document.getElementById('purchasedParts').value;
                order.repairNote = document.getElementById('repairNote').value;
                order.completedDate = new Date().toISOString().split('T')[0];
                
                localStorage.setItem('repairOrders', JSON.stringify(orders));
                document.getElementById('repairComplete').style.display = 'none';
                currentOrderId = null;
                renderOrders();
                updateStats();
                alert('Ремонт #' + order.id + ' завершен! Сумма: ' + (order.repairCost + order.partsCost) + ' руб');
            }
        }

        function editOrder(id) {
            const order = orders.find(o => o.id === id);
            if (order) {
                currentOrderId = id;
                document.getElementById('orderNumber').value = order.id;
                document.getElementById('orderDate').value = order.date;
                document.getElementById('clientPhone').value = order.phone;
                document.getElementById('clientName').value = order.clientName;
                document.getElementById('tool').value = order.tool;
                document.getElementById('malfunction').value = order.malfunction;
                document.getElementById('description').value = order.description;
                
                if (order.status === 'new') {
                    document.getElementById('repairComplete').style.display = 'block';
                } else {
                    document.getElementById('repairCost').value = order.repairCost;
                    document.getElementById('partsCost').value = order.partsCost;
                    document.getElementById('purchasedParts').value = order.purchasedParts;
                    document.getElementById('repairNote').value = order.repairNote;
                    document.getElementById('repairComplete').style.display = 'block';
                }
                
                showTab('new');
            }
        }

        function deleteOrder(id) {
            if (confirm('Удалить ремонт #' + id + '?')) {
                orders = orders.filter(o => o.id !== id);
                localStorage.setItem('repairOrders', JSON.stringify(orders));
                renderOrders();
                updateStats();
            }
        }

        function renderOrders() {
            const search = document.getElementById('searchOrders').value.toLowerCase();
            const filtered = orders.filter(o => 
                o.id.toString().includes(search) ||
                (o.phone && o.phone.includes(search)) ||
                (o.tool && o.tool.toLowerCase().includes(search)) ||
                (o.clientName && o.clientName.toLowerCase().includes(search))
            );

            document.getElementById('ordersList').innerHTML = filtered.map(o => `
                <tr>
                    <td><span class="order-number">${o.id}</span></td>
                    <td>${o.date}</td>
                    <td>${o.clientName || '-'}</td>
                    <td>${o.phone || '-'}</td>
                    <td>${o.tool}</td>
                    <td>${o.malfunction}</td>
                    <td><span class="${o.status === 'new' ? 'status-new' : 'status-done'}">${o.status === 'new' ? 'В ожидании' : 'Готов'}</span></td>
                    <td><span class="price">${o.repairCost + o.partsCost} руб</span></td>
                    <td>
                        <button class="action-btn action-edit" onclick="editOrder(${o.id})">✏️</button>
                        <button class="action-btn action-delete" onclick="deleteOrder(${o.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            const total = orders.length;
            const newCount = orders.filter(o => o.status === 'new').length;
            const doneCount = orders.filter(o => o.status === 'done').length;
            const revenue = orders.reduce((sum, o) => sum + (o.repairCost || 0) + (o.partsCost || 0), 0);

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statNew').textContent = newCount;
            document.getElementById('statDone').textContent = doneCount;
            document.getElementById('statRevenue').textContent = revenue.toLocaleString() + '₽';

            // Tool stats
            const toolStats = {};
            orders.filter(o => o.status === 'done').forEach(o => {
                if (!toolStats[o.tool]) toolStats[o.tool] = { count: 0, sum: 0 };
                toolStats[o.tool].count++;
                toolStats[o.tool].sum += (o.repairCost || 0) + (o.partsCost || 0);
            });

            const sortedTools = Object.entries(toolStats).sort((a, b) => b[1].count - a[1].count);
            document.getElementById('toolsStats').innerHTML = sortedTools.map(([tool, data]) => `
                <tr><td>${tool}</td><td>${data.count}</td><td>${data.sum} руб</td></tr>
            `).join('');
        }

        init();
    </script>
</body>
</html>
